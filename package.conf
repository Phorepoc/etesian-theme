# package.conf -- how the pdk's package.yml builds this repository's SIS (release.yml): the Etesian theme as a data-only package for phones whose
# image does not carry it (the Phorepoc images do: the pdk's theme_gen builds the same skin into the ROM). No components.
NAME=etesian-theme
ARCHES="arm"
IMAGE=ghcr.io/phorepoc/base
COMPONENTS_arm=""
ADDON=0
